<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地面站仪表盘</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 20px;
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 14px 16px;
    }
    .card h2 { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
    .row .k { color: #94a3b8; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    .warn { color: #facc15; }
    .video { width: 100%; border-radius: 8px; background: #000; margin-top: 8px; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .form input, .form button {
      background: #0f172a; color: #e2e8f0; border: 1px solid #475569;
      border-radius: 6px; padding: 8px; font-size: 13px;
    }
    .form .wide { grid-column: 1 / -1; }
    .form button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; }
    .form button:hover { background: #1d4ed8; }
    #result { margin-top: 8px; font-size: 12px; color: #93c5fd; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>地面站仪表盘 <span id="clock" style="color:#64748b;font-size:13px"></span></h1>

  <div class="grid">
    <!-- 无人机信息 -->
    <div class="card">
      <h2>✈ 无人机（pymavlink）</h2>
      <div class="row"><span class="k">连接状态</span><span id="drone-online">--</span></div>
      <div class="row"><span class="k">飞行模式</span><span id="drone-mode">--</span></div>
      <div class="row"><span class="k">解锁</span><span id="drone-armed">--</span></div>
      <div class="row"><span class="k">位置 (x,y,z)</span><span id="drone-pose">--</span></div>
      <div class="row"><span class="k">偏航</span><span id="drone-yaw">--</span></div>
      <div class="row"><span class="k">GPS</span><span id="drone-gps">--</span></div>
      <div class="row"><span class="k">电池</span><span id="drone-battery">--</span></div>
    </div>

    <!-- 地面机器人信息 -->
    <div class="card">
      <h2>🕷 地面机器人（SpiderPi Pro）</h2>
      <div class="row"><span class="k">连接状态</span><span id="robot-online">--</span></div>
      <div class="row"><span class="k">当前状态</span><span id="robot-state">--</span></div>
      <div class="row"><span class="k">位置估算 (x,y)</span><span id="robot-pos">--</span></div>
      <div class="row"><span class="k">朝向</span><span id="robot-heading">--</span></div>
      <div class="row"><span class="k">已抓取</span><span id="robot-picked">--</span></div>
      <div class="row"><span class="k">最后任务</span><span id="robot-task">--</span></div>
      <div class="row"><span class="k">最后结果</span><span id="robot-result">--</span></div>
      <div class="row"><span class="k">消息</span><span id="robot-message">--</span></div>
    </div>

    <!-- YOLO 模型信息 -->
    <div class="card">
      <h2>🧠 YOLO 模型</h2>
      <div class="row"><span class="k">模型</span><span id="model-name">--</span></div>
      <div class="row"><span class="k">加载状态</span><span id="model-loaded">--</span></div>
      <div class="row"><span class="k">置信度阈值</span><span id="model-conf">--</span></div>
      <div class="row"><span class="k">推理 FPS</span><span id="model-fps">--</span></div>
      <div class="row"><span class="k">累计检测</span><span id="model-total">--</span></div>
      <div class="row"><span class="k">各类别计数</span><span id="model-counts">--</span></div>
      <div class="row"><span class="k">最近检测</span><span id="model-last">--</span></div>
    </div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card">
      <h2>📡 无人机画面（YOLO 检测预览）</h2>
      <img id="video" class="video" src="/video.mjpeg" alt="no video">
    </div>

    <div class="card">
      <h2>🎯 下发任务给机器人</h2>
      <div class="form">
        <input id="t-x" type="number" step="0.1" placeholder="目标 x（米）" value="2.0">
        <input id="t-y" type="number" step="0.1" placeholder="目标 y（米）" value="0.0">
        <input id="t-radius" type="number" step="0.1" placeholder="到达半径（米）" value="0.8">
        <input id="t-conf" type="number" step="0.01" placeholder="置信度" value="0.87">
        <input class="wide" id="t-id" type="text" placeholder="任务编号（留空自动生成）">
        <button class="wide" onclick="sendTask()">发送任务</button>
      </div>
      <div id="result">--</div>
    </div>
  </div>

  <script>
    function el(id) { return document.getElementById(id); }

    async function refresh() {
      // 无人机
      try {
        const d = await (await fetch('/api/drone/status')).json();
        el('drone-online').textContent = d.online ? '在线' : (d.message || '离线');
        el('drone-online').className = d.online ? 'ok' : 'bad';
        el('drone-mode').textContent = d.state ? d.state.mode : '--';
        el('drone-armed').textContent = d.state ? (d.state.armed ? '已解锁' : '未解锁') : '--';
        el('drone-pose').textContent = d.pose ? (d.pose.x + ', ' + d.pose.y + ', ' + d.pose.z) : '--';
        el('drone-yaw').textContent = d.pose ? (d.pose.yaw_deg + '°') : '--';
        el('drone-gps').textContent = d.global ? (d.global.lat.toFixed(6) + ', ' + d.global.lon.toFixed(6)) : '--';
        el('drone-battery').textContent = d.battery ? (d.battery.percent + '% / ' + d.battery.voltage + 'V') : '--';
      } catch (e) { el('drone-online').textContent = '接口错误'; }

      // 机器人
      try {
        const r = await (await fetch('/api/robot/status')).json();
        el('robot-online').textContent = r.online ? '在线' : ('离线 ' + (r.error || ''));
        el('robot-online').className = r.online ? 'ok' : 'bad';
        el('robot-state').textContent = r.state || '--';
        el('robot-pos').textContent = r.position_m ? (r.position_m.x + ', ' + r.position_m.y) : '--';
        el('robot-heading').textContent = r.heading_deg != null ? (r.heading_deg + '°') : '--';
        el('robot-picked').textContent = r.picked_count != null ? r.picked_count : '--';
        el('robot-task').textContent = r.last_task ? (r.last_task.task_id || '?') : '--';
        el('robot-result').textContent = r.last_result || '--';
        el('robot-result').className = r.last_result === 'done' ? 'ok' : (r.last_result === 'failed' ? 'bad' : '');
        el('robot-message').textContent = r.message || '--';
      } catch (e) { el('robot-online').textContent = '接口错误'; }

      // 模型
      try {
        const m = await (await fetch('/api/model/status')).json();
        el('model-name').textContent = m.model || '--';
        el('model-loaded').textContent = m.loaded ? '已加载' : (m.message || '未加载');
        el('model-loaded').className = m.loaded ? 'ok' : 'bad';
        el('model-conf').textContent = m.conf != null ? m.conf : '--';
        el('model-fps').textContent = m.fps != null ? m.fps : '--';
        el('model-total').textContent = m.total_detections != null ? m.total_detections : '--';
        const c = m.counts ? Object.entries(m.counts).map(kv => kv[0] + '=' + kv[1]).join(' | ') : '--';
        el('model-counts').textContent = c;
        const l = m.last_detections && m.last_detections.length
          ? m.last_detections.map(d => d.class + ' ' + d.conf).join(', ') : '--';
        el('model-last').textContent = l;
      } catch (e) { el('model-name').textContent = '接口错误'; }
    }

    async function sendTask() {
      const id = el('t-id').value || ('T' + Date.now());
      const task = {
        task_id: id,
        target: {
          x: parseFloat(el('t-x').value),
          y: parseFloat(el('t-y').value),
          confidence: parseFloat(el('t-conf').value),
          source: 'dashboard'
        },
        arrive_radius: parseFloat(el('t-radius').value)
      };
      try {
        const resp = await fetch('/api/robot/task', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(task)
        });
        el('result').textContent = 'HTTP ' + resp.status + '\n' + JSON.stringify(await resp.json(), null, 2);
      } catch (e) {
        el('result').textContent = '发送失败: ' + e;
      }
    }

    function clock() {
      el('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(refresh, 2000);
    setInterval(clock, 1000);
    refresh();
  </script>
</body>
</html>
