<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芯联智控-研发进度流程图</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; padding: 10px 14px 14px; font-size: 16px; }

  .header { position: relative; text-align: center; margin-bottom: 4px; }
  .header .brand { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .header .brand .logo { height: 34px; }
  .header .brand .comp { font-size: 14px; color: #e2e8f0; }
  .header h1 { margin: 0; font-size: 20px; }
  .header .acts { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
  .header .acts a {
    background: #334155; color: #e2e8f0; border: 0; border-radius: 6px;
    padding: 6px 12px; font-size: 14px; text-decoration: none;
  }
  .header .acts a:hover { background: #475569; }
  .hint { color: #64748b; font-size: 13px; margin: 2px 0 8px; text-align: center; }

  .box { background: #1e293b; border-radius: 10px; padding: 8px 10px; }
  .titlebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .titlebar h2 { margin-bottom: 0; font-size: 15px; color: #94a3b8; font-weight: 400; }
  .chip { display: inline-block; font-size: 12px; line-height: 1; background: #334155; color: #cbd5e1; border-radius: 999px; padding: 4px 9px; }
  .chip b { color: #e2e8f0; font-weight: 600; }
  .chip.ok { background: #14532d; color: #86efac; }
  .chip.bad { background: #7f1d1d; color: #fecaca; }
  .chip.msg { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsbtn { margin-left: auto; background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }

  /* ==================== 流程图（竖版：从上往下读，为竖屏副显示器排版） ==================== */
  /* 整张图是竖版长图：宽 900 固定，高度由内容累加；fitFlow() 按可用空间整体缩放（整屏可见、不变形） */
  .flow-wrap {
    background: #0b1220; border-radius: 8px; padding: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* 横屏兜底：图太窄放不大时改成按宽铺满 + 纵向滚动 */
  .flow-wrap.scroll { overflow-y: auto; align-items: flex-start; }
  .flow-wrap svg.flow { display: block; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #flowPanel:fullscreen { background: #0f172a; width: 100vw; height: 100vh; overflow: auto; padding: 14px; display: flex; flex-direction: column; }
  #flowPanel:fullscreen .flow-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }

  /* 结构节点 */
  .flow-box { fill: #16233b; stroke: #334155; stroke-width: 1.5; }
  .flow-box.phase { fill: #1e293b; }
  .flow-box.struct { fill: #172554; stroke: #3b82f6; }
  .flow-box.mod { fill: #16233b; }
  .flow-box.mod.active { fill: #0b2f3d; stroke: #22d3ee; stroke-width: 2; }
  .flow-box.mod.done { fill: #0f2e1d; stroke: #22c55e; }
  .flow-group { fill: rgba(30,41,59,0.35); stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .flow-group.done { fill: rgba(15,46,29,0.35); stroke: #22c55e; stroke-width: 1.5; }
  .flow-group.active { fill: rgba(11,47,61,0.5); stroke: #22d3ee; stroke-width: 1.8; }
  .flow-t { fill: #cbd5e1; font-size: 15px; }
  .flow-t.small { font-size: 12px; fill: #94a3b8; }
  .flow-t.title { font-size: 18px; fill: #e2e8f0; }
  .flow-t.center { text-anchor: middle; dominant-baseline: middle; }

  /* 步骤节点（方框左侧竖条就是它的进度条）
     文字一律**竖排**（一个汉字一行）—— 和原《研发工单》图里一模一样 */
  .fl-step { fill: #111c30; stroke: #334155; stroke-width: 1.2; }
  .fl-step.done { fill: #0f2e1d; stroke: #22c55e; }
  .fl-step.active { fill: #0b2f3d; stroke: #22d3ee; stroke-width: 2; animation: flPulse 1.8s ease-in-out infinite; }
  .v-t { font-size: 14px; fill: #94a3b8; text-anchor: middle; }
  .v-t.done { fill: #86efac; }
  .v-t.active { fill: #a5f3fc; font-weight: 600; }
  .phase-spine { fill: #16304d; }
  .fl-bar-bg { fill: #1e293b; }
  .fl-bar-fill { fill: #22c55e; }
  .fl-bar-fill.active { fill: #22d3ee; animation: flShim 1.4s ease-in-out infinite; }
  @keyframes flShim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes flPulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }

  /* ==================== 连线 = 管道（管壁 + 管腔 + 管内水流） ====================
     一层层叠出"管子"的质感（不是虚线跑马灯）：
       ① 管壁（外圈） ② 深色管腔（空心管子） ③ 亮边/暗边两条偏移线 → 圆柱立体感
       ④ 管内水体（满管半透明，颜色跟状态）    ← 未开始 = 空管，里面没水
       ⑤ 流动水柱的光晕 ⑥ 流动水柱 ⑦ 水柱高光   ← 沿管子连续扫过的"水袖"
     水柱长度/周期都按管道实际长度算 → 长短不同的管子流速看起来一致。
     管子太短（< 28px，如分水器往下滴的那一小截）就不加流动层，省得糊成一团。 */
  .pipe-wall { fill: none; stroke: #16293f; stroke-width: 9.5; stroke-linejoin: round; }
  .pipe-bore { fill: none; stroke: #060e1a; stroke-width: 6.4; stroke-linejoin: round; }
  .pipe-rim { fill: none; stroke: #3f739f; stroke-width: 1.2; opacity: 0.75; stroke-linejoin: round; }
  .pipe-shade { fill: none; stroke: #04080e; stroke-width: 2; opacity: 0.5; stroke-linejoin: round; }
  .pipe-water { fill: none; stroke-width: 4; opacity: 0.4; }   /* 静态水体：方口，和管口齐平，不露圆头 */
  .pipe-halo, .pipe-flow, .pipe-gloss { animation: pipeFlow 1.3s linear infinite; }
  .pipe.done .pipe-halo, .pipe.done .pipe-flow, .pipe.done .pipe-gloss { animation-duration: 2.4s; }
  @keyframes pipeFlow { to { stroke-dashoffset: -70; } }   /* 周期固定 70(30+40)，纯 CSS 无限循环，永不卡顿 */
  .spine-core { animation: spineBreath 2.2s ease-in-out infinite; }
  @keyframes spineBreath { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .phase-title { font-weight: 600; paint-order: stroke; stroke-width: 5px; stroke-opacity: .3; }
  .phase-title.pt1 { fill: #9cc3ff; stroke: #7fb2ff; }      /* 第一阶段：蓝 */
  .phase-title.pt2 { fill: #c4b5fd; stroke: #a78bfa; }      /* 第二阶段：紫 */
  .pipe-halo { fill: none; stroke-width: 6.4; stroke-linecap: round; opacity: 0.2; }
  .pipe-flow { fill: none; stroke-width: 3.6; stroke-linecap: round; opacity: 0.95; }
  .pipe-gloss { fill: none; stroke: #ecfeff; stroke-width: 1.2; stroke-linecap: round; opacity: 0.85; }
  .pipe.live .pipe-water, .pipe.live .pipe-halo, .pipe.live .pipe-flow { stroke: #22d3ee; }
  .pipe.done .pipe-water, .pipe.done .pipe-halo, .pipe.done .pipe-flow { stroke: #22c55e; }
  .pipe.idle .pipe-water { stroke: #2f6fb0; opacity: 0.3; }   /* 管子已经通了，只是还没开始跑水 */
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="/images/logo.png" class="logo" alt="logo">
      <span class="comp">2026年世界职业院校技能大赛</span>
    </div>
    <h1>芯联智控-研发进度流程图</h1>
    <div class="acts">
      <a id="hubLink" href="#" target="_blank">↩ 返回中控台</a>
    </div>
  </div>
  <div class="hint">《空地协同农作害虫AI视觉自动巡检捕获系统》研发工单 · 进度实时同步自地面站中枢</div>

  <div class="box" id="flowPanel">
    <div class="titlebar">
      <h2>🧭 研发进度流程</h2>
      <span class="chip" id="fOnline">中枢 -</span>
      <span class="chip">总进度 <b id="fTotal">-</b></span>
      <span class="chip msg">当前 <b id="fCurrent">-</b></span>
      <button class="fsbtn" id="fsBtn">⛶ 全屏</button>
    </div>
    <div class="flow-wrap" id="flowWrap"></div>
  </div>

<script>
// ---------------- 研发进度流程图（数据来自中枢 /api/progress/flow，本服务已代理） ----------------
// 版面 / 文字**完全照《研发工单》原图**：标题 → 第一阶段（手动） → 第二阶段 → 四模块 → 各自步骤列 → 综合展示
// 区别只有一个：原图是横版，这里改成**竖版**（自上而下串成一条水线），方便挂在竖屏副显示器上。
const FLOW_KEYS = ['drone', 'yolo', 'hub', 'robot'];
const FLOW_GROUPS = { drone: '无人机自动巡检', yolo: '模型训练', hub: '中枢互通', robot: '机器人自动捕获' };

// 原图里的模块框文字（照原图断行：无人机 / 自动巡检）
const MOD_LINES = {
  drone: ['无人机', '自动巡检'],
  yolo:  ['模型训练'],
  hub:   ['中枢互通'],
  robot: ['机器人', '自动捕获'],
};

// 原图里的步骤列文字（逐字照抄原图，一个字都不改）
//   每个模块 = 若干「行」，每行 = 若干「列」，一列一个步骤（列内文字竖排）
const FLOW_STEPS = {
  drone: [['自动直线飞行', 'S型提高巡检效率', '多机共检：修理飞机']],
  yolo:  [['拍照采样、数据标注', '欠拟合模型训练', '正常模型训练', '过拟合模型训练']],
  hub:   [['网络连线', '网络配置', '架设平台'], ['安装系统', '配置环境', '部署软件']],
  robot: [['开发稳压电路板', '视觉追踪', '自主寻路', '自动抓取']],
};

// 第一阶段：手动链路（原图是横向三框串联，竖版改成一列向下串联，节点/顺序不变）
const MANUAL = [['手动操控', '无人机巡检'], ['人工传输', '巡检信息'], ['手动操控', '机器人捕获']];

// ---- 竖版版面常量 ----
// 左右留白必须对称（M = RM）：这样「列的中心」才会正好落在画布中轴上，
// 模块框的落管才能不偏不倚地接进列的正中间。
const LV = {
  W: 960, M: 56, RM: 56,  // 画布宽 / 左右留白（左边这条走廊是给主管道的）
  RAIL: 26,               // 左侧主管道的横坐标
  stW: 150, stGap: 50,    // 步骤列宽 / 列间距
  rowGap: 22, grpPadY: 12,
  modW: 210, modH: 60,    // 模块标题框
  pillW: 700, pillH: 46,  // 研发工单
  phW: 420, phH: 40,      // 两个阶段
  manW: 300, manH: 54, manGapV: 38, manPadY: 18,
  botW: 470, botH: 46,    // 综合展示
  GAP: 36,                // 模块组之间的竖向间距
  DROP: 48,               // 模块框 → 步骤行 的落差（分水器高度）
  SHORT: 28,              // 短于这个长度的管子不加流动层
};

function setTxt(id, text) {
  const e = document.getElementById(id);
  if (e) e.textContent = (text == null || text === '') ? '-' : text;
}

// 管道路径总长（支持多段：主管道会有拐弯），用来给水柱算周期
function pipeLen(d) {
  const nums = d.match(/-?[\d.]+/g) || [];
  let len = 0;
  for (let i = 2; i + 1 < nums.length; i += 2) {
    len += Math.abs(+nums[i] - +nums[i - 2]) + Math.abs(+nums[i + 1] - +nums[i - 1]);
  }
  return len || 40;
}

// 管子的走向（决定亮边/暗边往哪一侧偏）
function pipeDir(d) {
  const nums = d.match(/-?[\d.]+/g) || [];
  let dx = 0, dy = 0;
  for (let i = 2; i + 1 < nums.length; i += 2) {
    dx += Math.abs(+nums[i] - +nums[i - 2]);
    dy += Math.abs(+nums[i + 1] - +nums[i - 1]);
  }
  return dy >= dx ? 'v' : 'h';
}

// 把一段连线画成「管道」：管壁 + 管腔 + 亮/暗边 + 管内流动的水
// mult：粗细倍数（主管道用 1.3，支管用 1）
// 流动不再用 SMIL：水柱虚线周期统一固定为 70(30+40)，由一条 CSS 无限循环动画驱动
// （stroke-dashoffset 0 → -70 正好一个周期，所以永远连续、不会一卡一卡）
function flPipe(d, state, mult) {
  const k = mult || 1;
  const len = pipeLen(d);
  const dir = pipeDir(d);
  const rim = dir === 'v' ? `transform="translate(${(-2.4 * k).toFixed(2)},0)"`
                          : `transform="translate(0,${(-2.4 * k).toFixed(2)})"`;
  const shade = dir === 'v' ? `transform="translate(${(2.6 * k).toFixed(2)},0)"`
                            : `transform="translate(0,${(2.6 * k).toFixed(2)})"`;
  const w = (n) => `stroke-width="${(n * k).toFixed(2)}"`;
  let out = `<g class="pipe ${state}">`;
  out += `<path class="pipe-wall" d="${d}" ${w(9.5)}/>`;
  out += `<path class="pipe-bore" d="${d}" ${w(6.4)}/>`;
  if (state !== 'pending') {       // 未开始(idle)也给「水体」色：管子通了，只是还没开始跑
    out += `<path class="pipe-water" d="${d}" ${w(4)}/>`;
    if ((state === 'live' || state === 'done') && len >= LV.SHORT) {
      out += `<path class="pipe-halo" d="${d}" ${w(6.4)} stroke-dasharray="30 40"/>`
         + `<path class="pipe-flow" d="${d}" ${w(3.6)} stroke-dasharray="30 40"/>`
         + `<path class="pipe-gloss" d="${d}" stroke-width="${(1.2 * k).toFixed(2)}" stroke-dasharray="12 58"/>`;
    }
  }
  out += `<path class="pipe-rim" d="${d}" ${w(1.2)} ${rim}/>`;      // 亮边：体现管子是圆的
  out += `<path class="pipe-shade" d="${d}" ${w(2)} ${shade}/>`;    // 暗边
  out += `</g>`;
  return out;
}

// ---- 竖排文字（一个汉字一行）——原图里"步骤列"就是这个排法 ----
function vText(text, cx, y0, cls, gap) {
  const chars = Array.from(text);
  const st = gap || 13.6;
  return chars.map((ch, i) =>
    `<text class="${cls}" x="${cx}" y="${(y0 + i * st).toFixed(1)}">${ch}</text>`
  ).join('');
}

// ---- 阶段条（原图里的"堆叠矩形"造型）----
// 书脊 = 一根常亮的指示灯（每个阶段自己的颜色：一蓝一紫，一眼能区分）；
// 该阶段全部做完时灯变绿。标题文字也带同色光晕，一开始就亮着。
function phaseBox(x, y, w, h, text, st, tcls, accent) {
  const c = st === 'done' ? '#22c55e' : accent;
  return `<rect class="flow-box phase" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`
    + `<rect x="${x + 4.5}" y="${y + 3.5}" width="16" height="${h - 7}" rx="4.5" fill="${c}" opacity="0.2"/>`
    + `<rect class="phase-spine" x="${x + 8}" y="${y + 6}" width="9" height="${h - 12}" rx="2"/>`
    + `<rect class="spine-core" x="${x + 11}" y="${y + 9}" width="3" height="${h - 18}" rx="1.5" fill="${c}"/>`
    + `<text class="flow-t center phase-title ${tcls}" x="${x + w / 2}" y="${y + h / 2}">${text}</text>`;
}

// 版面照原《研发工单》图，只是竖过来：
//   工单 → 第一阶段 → 手动链路(3 框) → 第二阶段
//   第二阶段从左侧接出一条「主管道」，四个模块各自从主管道分一路支管（并行推进，互不串联），
//   每个模块虚线框里：模块框 + 分水器 + 它的步骤列（列内文字竖排）
//   主管道走到底汇进「综合展示」
// 所有连线都画成"管道"（管壁 + 管腔 + 管里流动的水）
function buildFlowSvg(data) {
  const byKey = {};
  (data.modules || []).forEach(m => { byKey[m.key] = m; });
  const mods = FLOW_KEYS.map(k => byKey[k] ||
    { key: k, name: FLOW_GROUPS[k], percent: 0, current: -1, steps: [] });

  const L = LV, W = L.W, M = L.M, cx = W / 2, grpW = W - M - L.RM;

  // 每个模块「步骤组」的几何：列数 / 行数 / 最长文字 → 竖排框高度
  const geo = FLOW_KEYS.map(k => {
    const rows = FLOW_STEPS[k];
    let maxChars = 2;
    rows.forEach(r => r.forEach(t => { maxChars = Math.max(maxChars, Array.from(t).length); }));
    const boxH = Math.max(96, Math.round(44 + maxChars * 13.6));
    const cols = Math.max(...rows.map(r => r.length));
    const rowW = cols * L.stW + (cols - 1) * L.stGap;
    const rowX = M + (grpW - rowW) / 2;
    const firstCx = rowX + L.stW / 2;              // 第一列中心（分水横管的左端）
    const lastCx = rowX + (cols - 1) * (L.stW + L.stGap) + L.stW / 2;
    const nCol = rows.reduce((a, r) => a + r.length, 0);
    const H = L.grpPadY + L.modH + L.DROP + rows.length * boxH
            + (rows.length - 1) * L.rowGap + L.grpPadY;
    return { rows, boxH, cols, rowW, rowX, firstCx, lastCx, nCol, H };
  });

  const anyActive = mods.some(m => (m.steps || []).some(t => t.state === 'active'));
  const anyDone = mods.some(m => (m.steps || []).some(t => t.state === 'done'));
  // 结构管路：跑起来就是急流(live) → 跑完是缓流(done) → 都没动就是"通水未启动"(idle)
  const trunk = anyActive ? 'live' : (anyDone ? 'done' : 'idle');

  const modState = (steps) => {
    const hasActive = steps.some(t => t.state === 'active');
    const someDone = steps.some(t => t.state === 'done');
    const allDone = steps.length > 0 && steps.every(t => t.state === 'done');
    return { cls: allDone ? 'done' : ((hasActive || someDone) ? 'active' : ''),
             st: allDone ? 'done' : ((hasActive || someDone) ? 'live' : 'idle') };
  };

  // 第一阶段（手动链路三框）的状态
  const phSteps = (byKey.phase1 || {}).steps || [];
  const phSt = i => (phSteps[i] || {}).state || 'pending';
  const phCls = i => (phSt(i) === 'done' ? 'done' : (phSt(i) === 'active' ? 'active' : ''));
  const phPipe = i => (phSt(i) === 'done' ? 'done' : 'idle');   // 第 i 步完成 → 它后面的管子才有水
  const ph1st = (phSteps.length && phSteps.every(s => s.state === 'done')) ? 'done'
              : (phSteps.some(s => s.state === 'active') ? 'active' : 'idle');
  // 第二阶段（四个模块）整体状态
  const allSteps = mods.reduce((a, m) => a.concat(m.steps || []), []);
  const ph2st = (allSteps.length && allSteps.every(s => s.state === 'done')) ? 'done'
              : (allSteps.some(s => s.state === 'active' || s.state === 'done') ? 'active' : 'idle');
  // 步骤列的亮灯：中枢里每个模块是 6 步，原图里是 3/4/6 列
  // → 按"模块完成比例 × 列数"把状态等比铺到各列上（做几步，前面几列就亮几步）
  const colStates = (steps, n) => {
    const tot = steps.length || 1;
    const done = steps.filter(s => s.state === 'done').length;
    const act = steps.some(s => s.state === 'active') ? 0.5 : 0;
    const pos = Math.min(1, (done + act) / tot) * n;
    const out = [];
    for (let j = 0; j < n; j++) {
      out.push(pos >= j + 1 - 1e-6 ? 'done' : (pos > j ? 'active' : 'pending'));
    }
    return out;
  };

  // ---- y 轴自上而下推进 ----
  let y = 12;
  const yTitle = y; y += L.pillH + L.GAP;
  const yPh1 = y; y += L.phH + L.GAP;
  const manH2 = L.manPadY * 2 + 3 * L.manH + 2 * L.manGapV;
  const yMan = y; y += manH2 + L.GAP;
  const yPh2 = y; y += L.phH + L.GAP;
  const modY = [];
  let yy = y;
  geo.forEach(g => { modY.push(yy); yy += g.H + L.GAP; });
  const yBot = yy;                     // 已经含了最后一个 GAP
  const H = yBot + L.botH + 14;

  let s = `<svg class="flow" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // ① 研发工单（原图标题一字不改）
  s += `<rect class="flow-box struct" x="${cx - L.pillW / 2}" y="${yTitle}" width="${L.pillW}" height="${L.pillH}" rx="23"/>`;
  s += `<text class="flow-t title center" x="${cx}" y="${yTitle + L.pillH / 2}">《空地协同农作害虫AI视觉自动巡检捕获系统》研发工单</text>`;

  // ② 第一阶段验证可行性
  s += flPipe(`M${cx} ${yTitle + L.pillH} L${cx} ${yPh1}`, trunk);
  s += phaseBox(cx - L.phW / 2, yPh1, L.phW, L.phH, '第一阶段验证可行性', ph1st, 'pt1', '#7fb2ff');

  // ③ 手动链路（第一阶段）：三个框串联，勾选状态来自中枢 phase1 模块
  s += flPipe(`M${cx} ${yPh1 + L.phH} L${cx} ${yMan}`, trunk);
  s += `<rect class="flow-group" x="${cx - L.manW / 2 - 20}" y="${yMan}" width="${L.manW + 40}" height="${manH2}" rx="10"/>`;
  const manBy = i => yMan + L.manPadY + i * (L.manH + L.manGapV);
  MANUAL.forEach((lines, i) => {
    const by = manBy(i);
    if (i) s += flPipe(`M${cx} ${manBy(i - 1) + L.manH} L${cx} ${by}`, phPipe(i - 1));
    s += `<rect class="flow-box mod ${phCls(i)}" x="${cx - L.manW / 2}" y="${by}" width="${L.manW}" height="${L.manH}" rx="6"/>`;
    lines.forEach((t, k) => {
      s += `<text class="flow-t center" x="${cx}" y="${by + L.manH / 2 - (lines.length - 1) * 8.5 + k * 17}">${t}</text>`;
    });
  });

  // ④ 第二阶段研发自动化系统（第一阶段三步全走完，这段管子才通）
  s += flPipe(`M${cx} ${yMan + manH2} L${cx} ${yPh2}`, phSt(2) === 'done' ? 'done' : 'idle');
  // 主管道从左下接进来（先画，这样它的右端会被阶段框盖住，不露头）
  s += flPipe(`M${L.RAIL} ${yPh2 + L.phH / 2} L${cx - L.phW / 2} ${yPh2 + L.phH / 2}`, trunk, 1.3);
  s += phaseBox(cx - L.phW / 2, yPh2, L.phW, L.phH, '第二阶段研发自动化系统', ph2st, 'pt2', '#a78bfa');

  // ⑤ 一条「主管道」贴着左侧：从第二阶段接出来，一路往下，最后汇进综合展示。
  //    四个模块不再互相串联，而是各自从主管道上分一路支管（原图里四个模块互通，
  //    说的是它们并行推进、共用一套系统 —— 不是"上一个模块的产物流进下一个模块"）。
  const railX = L.RAIL;
  const railY0 = yPh2 + L.phH / 2;               // 主管道起点：第二阶段的左侧
  const railY1 = yBot + L.botH / 2;              // 主管道终点：综合展示的左侧
  s += flPipe(`M${railX} ${railY0} L${railX} ${railY1}`, trunk, 1.3);
  s += flPipe(`M${railX} ${railY1} L${cx - L.botW / 2} ${railY1}`, trunk, 1.3);

  // ⑥ 每个模块：从主管道分一路支管进来 → 模块框 → 分水器 → 它的步骤列
  mods.forEach((m, i) => {
    const g = geo[i], gy = modY[i], ms = modState(m.steps || []);
    const modTop = gy + L.grpPadY;
    const modBottom = modTop + L.modH;
    const modCy = modTop + L.modH / 2;
    const rowsY = modBottom + L.DROP;
    const yR = r => rowsY + r * (g.boxH + L.rowGap) - 14;      // 分水器横管的高度
    const sts = colStates(m.steps || [], g.nCol);
    const colCx = j => g.rowX + j * (L.stW + L.stGap) + L.stW / 2;

    // 组虚线框（先画）
    s += `<rect class="flow-group ${ms.cls}" x="${M}" y="${gy}" width="${grpW}" height="${g.H}" rx="12"/>`;

    // —— 先画所有管子（端点随后被框盖住，不露头、不凸出） ——
    // 支管：主管道 → 模块框左侧
    s += flPipe(`M${railX + 6.5} ${modCy} L${cx - L.modW / 2} ${modCy}`, ms.st);
    // 落管：模块框 → 顶部横管
    s += flPipe(`M${cx} ${modBottom} L${cx} ${yR(0)}`, ms.st);
    if (g.rows.length > 1) {
      // 多行（中枢互通）：一条宽横管横贯顶部，左右两端各垂一路 ——
      //   左端进第一行最左列、右端进最后一行最右列，每行内部用短管串起来（蛇形）。
      const yTop = yR(0);
      const leftX = g.rowX - 40, rightX = g.rowX + g.rowW + 40;   // 两端垂管立在列外侧
      const r1y = rowsY + g.boxH / 2;                             // 第一行的中缝高度
      const rNy = rowsY + (g.rows.length - 1) * (g.boxH + L.rowGap) + g.boxH / 2;
      s += flPipe(`M${leftX} ${yTop} L${rightX} ${yTop}`, ms.st);                 // 宽横管
      s += flPipe(`M${leftX} ${yTop} L${leftX} ${r1y} L${g.rowX} ${r1y}`, ms.st);        // 左端 → 第一行最左
      s += flPipe(`M${rightX} ${yTop} L${rightX} ${rNy} L${g.rowX + g.rowW} ${rNy}`, ms.st); // 右端 → 最后一行最右
      g.rows.forEach((row, r) => {
        const ry = rowsY + r * (g.boxH + L.rowGap);
        for (let j = 1; j < row.length; j++) {                    // 行内短管：把列串起来
          s += flPipe(`M${colCx(j - 1) + L.stW / 2} ${ry + g.boxH / 2}`
                    + ` L${colCx(j) - L.stW / 2} ${ry + g.boxH / 2}`, ms.st);
        }
      });
    } else {
      // 单行：一条与首末列齐平的横管，往每列头顶各滴一根
      const yr = yR(0);
      s += flPipe(`M${g.firstCx} ${yr} L${g.lastCx} ${yr}`, ms.st);
      g.rows[0].forEach((txt, j) => {
        s += flPipe(`M${colCx(j)} ${yr} L${colCx(j)} ${rowsY}`, ms.st);
      });
    }

    // —— 再画框和文字（盖住上面的管子端点） ——
    s += `<rect class="flow-box mod ${ms.cls}" x="${cx - L.modW / 2}" y="${modTop}" width="${L.modW}" height="${L.modH}" rx="6"/>`;
    const lines = MOD_LINES[m.key] || [m.name || FLOW_GROUPS[m.key]];
    lines.forEach((t, k) => {
      s += `<text class="flow-t center" x="${cx}" y="${modTop + (lines.length > 1 ? 24 + k * 18 : L.modH / 2)}">${t}</text>`;
    });
    s += `<text class="flow-t small" text-anchor="end" x="${M + grpW - 16}" y="${modTop + 20}">`
       + `进度 ${m.percent}%</text>`;

    let idx = 0;
    g.rows.forEach((row, r) => {
      const ry = rowsY + r * (g.boxH + L.rowGap);
      row.forEach((txt, j) => {
        const bx = g.rowX + j * (L.stW + L.stGap);
        const ccx = bx + L.stW / 2;
        const stt = sts[idx++] || 'pending';
        s += `<rect class="fl-step ${stt}" x="${bx}" y="${ry}" width="${L.stW}" height="${g.boxH}" rx="6"/>`;
        const nCh = Array.from(txt).length;
        const ty0 = ry + g.boxH / 2 - (nCh - 1) * 13.6 / 2 + 4.6;      // 竖排文字整体居中
        s += vText(txt, ccx, ty0, 'v-t ' + stt, 13.6);
        // 进度条：贴在方框左侧那根竖条
        const barH = g.boxH - 16, barX = bx + 6;
        s += `<rect class="fl-bar-bg" x="${barX}" y="${ry + 8}" width="4" height="${barH}" rx="2"/>`;
        if (stt === 'done') {
          s += `<rect class="fl-bar-fill" x="${barX}" y="${ry + 8}" width="4" height="${barH}" rx="2"/>`;
        } else if (stt === 'active') {
          s += `<rect class="fl-bar-fill active" x="${barX}" y="${ry + 8 + barH * 0.4}"`
             + ` width="4" height="${(barH * 0.6).toFixed(1)}" rx="2"/>`;
        }
      });
    });
  });

  // ⑦ 综合展示（水由主管道从左侧送进来，见 ⑤）
  s += `<rect class="flow-box struct" x="${cx - L.botW / 2}" y="${yBot}" width="${L.botW}" height="${L.botH}" rx="8"/>`;
  s += `<text class="flow-t title center" x="${cx}" y="${yBot + L.botH / 2}">综合展示：自动巡检与捕获</text>`;
  s += `</svg>`;
  return s;
}

// 竖版长图自适应：按可用宽高取较小缩放比 → 整张图一屏可见、比例不变形
// 例外：横屏（比如在中枢的 1920×1080 上打开）时按高缩会小到看不清，
//       这时改成「按宽铺满 + 纵向滚动」，宁可滚动也不要糊成一片。
function fitFlow() {
  const wrap = document.getElementById('flowWrap');
  if (!wrap) return;
  const svg = wrap.querySelector('svg.flow');
  if (!svg) return;
  const vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
  if (vb.length !== 4 || !vb[2] || !vb[3]) return;
  const availW = wrap.clientWidth - 16;
  const availH = window.innerHeight - wrap.getBoundingClientRect().top - 22;
  if (availW <= 0 || availH <= 0) return;
  const fitW = availW / vb[2], fitH = availH / vb[3];
  let scale = Math.min(fitW, fitH);
  let scroll = false;
  if (scale < 0.5) {                    // 太小了：按宽铺满，改成纵向滚动
    scale = Math.min(fitW, 1);
    scroll = true;
  }
  const apply = (k) => {
    svg.style.width = Math.round(vb[2] * k) + 'px';
    svg.style.height = Math.round(vb[3] * k) + 'px';
  };
  wrap.classList.toggle('scroll', scroll);
  apply(scale);
  // 收尾校正：若仍超出屏幕（滚动条/文字换行导致版式微变），只缩不放，避免来回抖
  if (!scroll) {
    const over = document.body.scrollHeight - window.innerHeight;
    if (over > 0) apply(Math.max(0.3, scale - over / vb[3]));
  }
}

let flowSig = '';
async function refreshFlow() {
  let d;
  try {
    d = await (await fetch('/api/progress/flow')).json();
  } catch (e) {
    setTxt('fOnline', '● 接口错误');
    document.getElementById('fOnline').className = 'chip bad';
    return;
  }
  const on = document.getElementById('fOnline');
  if (!d.hub_online) {                       // 中枢没起来：提示而不是白屏
    on.textContent = '● 中枢未连接';
    on.className = 'chip bad';
    setTxt('fTotal', '-');
    setTxt('fCurrent', d.error || '中枢不可达');
    if (flowSig !== 'offline') {
      flowSig = 'offline';
      document.getElementById('flowWrap').innerHTML =
        '<div style="color:#64748b;font-size:14px;padding:24px;text-align:center">'
        + '中枢未连接，拿不到进度数据<br>'
        + '<span style="font-size:13px">' + (d.hub_url || '') + '　' + (d.error || '') + '</span></div>';
    }
    return;
  }
  if (d.hub_url) document.getElementById('hubLink').href = d.hub_url;

  const mods = d.modules || [];
  const total = d.total_percent;
  on.textContent = total > 0 ? '● 进行中' : '● 未开始';
  on.className = 'chip ' + (total > 0 ? 'ok' : '');
  setTxt('fTotal', total != null ? total + '%' : '-');
  const act = mods.filter(m => m.current >= 0 && m.current_name && m.current_name !== '-');
  setTxt('fCurrent', act.length ? act.map(m => m.current_name).join('　|　') : '未开始');

  // 状态没变就不重绘：避免打乱连线流动/脉冲动画
  const sig = mods.map(m => m.key + ':' + m.percent + ':' +
    (m.steps || []).map(t => t.state.charAt(0)).join('') +
    ':' + (m.timing ? m.timing.state : '')).join('|');
  if (sig === flowSig) return;
  flowSig = sig;
  document.getElementById('flowWrap').innerHTML = buildFlowSvg(d);
  fitFlow();
}

document.getElementById('fsBtn').onclick = () => {
  const box = document.getElementById('flowPanel');
  if (!document.fullscreenElement) {
    (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
  } else {
    document.exitFullscreen();
  }
};
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fsBtn').textContent =
    document.fullscreenElement ? '✕ 退出全屏' : '⛶ 全屏';
  setTimeout(fitFlow, 60);   // 等全屏尺寸生效后再算一次
});
window.addEventListener('resize', fitFlow);

refreshFlow();
setInterval(refreshFlow, 2000);
</script>
