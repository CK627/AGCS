# =====================================================================
# AGCS 四仪表盘 + 服务端口总览（参考文档）
#
# 各仪表盘实际读自己目录下的 data/config.yaml，本文件只做汇总参考。
#
#   ┌─────────────────────────────────────────────────────────────────┐
#   │  端口       归属                 类型     目录                     │
#   │  20000      地面站中枢            HTTP     GroundStation/Dashboard │
#   │  20001      地面机器人仪表盘      HTTP     GroundRobot/Dashboard   │
#   │  20002      无人机仪表盘          HTTP     Dron/Dashboard          │
#   │  20003      YOLO 模型仪表盘       HTTP     YOLOModel/Dashboard     │
#   │  20004      仪表盘自动发现广播    UDP      agcs_drone/agcs_yolo    │
#   │  20005      无人机图传视频流转发  HTTP     Dron/Dashboard /video_feed│
#   │  5000       地面机器人 task_server HTTP   树莓派（/status /task    │
#   │                                          /video.mjpeg）           │
#   │  14550      MAVLink 数传         UDP      pymavlink 监听（标准）    │
#   │  8080       QGC 数传             UDP      地面站数传（标准）        │
#   └─────────────────────────────────────────────────────────────────┘
#
# 改配置请改对应仪表盘的 data/config.yaml（保存即热重载，端口除外）。
# =====================================================================

robot:
  url: http://10.194.228.89:5000   # 地面机器人 task_server 地址（树莓派，端口 5000）；IP 变了改这里
  video: true                      # 机器人摄像头回传画面开关

drone:
  url: http://127.0.0.1:20002      # 无人机仪表盘（Dron/Dashboard）地址；中枢从这里拉图传画面
  camera: 0                        # EWRF 图传接收机的 USB 摄像头序号
  video: true                      # 无人机画面开关
  video_port: 20005                # 无人机图传视频流独立转发端口

yolo:
  url: http://127.0.0.1:20003      # YOLO 模型仪表盘（YOLOModel/Dashboard）地址；中枢从这里拉检测数据与标注画面
  video: true                      # YOLO 检测画面开关

dashboard:
  hub_port: 20000                  # 地面站中枢端口
  robot_port: 20001                # 地面机器人仪表盘端口
  drone_port: 20002                # 无人机仪表盘端口
  yolo_port: 20003                 # YOLO 模型仪表盘端口
