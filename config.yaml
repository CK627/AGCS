# =====================================================================
# AGCS 临时运行配置 —— 需要临时调整的都改这一个文件
#
# 谁在用：GroundStation/Dashboard（地面站中枢 20001）
#         GroundRobot/Dashboard  （机器人独立仪表盘 20002）
#         Dron/Dashboard         （无人机电脑端仪表盘 20000）
#
# 生效方式：保存即生效（各仪表盘每次请求会热重载本文件，无需重启）；
#           只有端口项例外，改端口需要重启对应仪表盘。
# =====================================================================

robot:
  url: http://10.194.228.89:5000   # 机器人 task_server 地址；机器人 IP 变了改这里（两个仪表盘同时生效）
  video: true                      # 机器人摄像头回传画面开关（false 时页面提示已关闭，不再空转等画面）

drone:
  url: http://127.0.0.1:20000      # 无人机电脑端仪表盘（Dron/Dashboard）地址：中枢从这里拉图传画面；
                                   # 中枢和它不在同一台电脑时，改成那台电脑的局域网 IP
  camera: 0                        # EWRF 图传接收机的 USB 摄像头序号（在插接收机的电脑上运行
                                   # 外接图传录制程序/capture_external_camera.py --list 查看，从 0 数起）
  video: true                      # 无人机画面开关（图传接收机没插/不想看时设 false）

dashboard:
  hub_port: 20001                  # 地面站中枢监听端口（改后需重启中枢）
  robot_port: 20002                # 机器人独立仪表盘端口（改后需重启）
  drone_port: 20000                # 无人机电脑端仪表盘端口（改后需重启）
