# 机器人行为参数（自动任务用）
# 同步到树莓派后位于 ~/spiderpi/config/robot_params.yaml

vision:
  target_color: red        # 颜色检测目标（red/green/blue）
  min_area: 500            # 判定有效目标的最小轮廓面积（640x480 画面下）
  camera_rotate: 0         # 摄像头画面旋转角度（0/90/180/270；物理已重装，默认 0）

walk:
  stride: 60               # 直行步幅 mm
  speed: 50                # 直行速度 mm/s
  turn_angle: 15           # 原地转向角度 deg
  turn_speed: 50           # 转向速度 deg/s
  align_tolerance: 40      # 目标中心与画面中心的像素偏差容差
  approach_area: 3000      # 目标面积达到该值视为已到抓取距离
  reach_x: 8.0             # 机械臂可及范围 x（cm），超出则继续接近
  reach_y: 24.0            # 机械臂可及范围 y（cm），超出则继续接近

obstacle:
  threshold: 3.0           # 避障触发距离 cm
  target_radius_gate: 30   # 目标半径超过此值视为前方是目标，不再触发避障停止
  back_stride: 80          # 后退步幅 mm
  filter_window: 5         # 超声波距离滤波窗口

nav:
  arrive_radius: 0.8       # 到达判定半径（米）：进入该范围后切近景搜索
  heading_tolerance: 5.0   # 朝向误差容差（度）
  max_walk_m: 15.0         # 单任务最大行走距离（米），超出上报 failed

arm:
  detect_pose: [0, 15, 5]  # 机械臂检测姿态（x, y, z）cm，与官方 block_fetch 一致
  approach_z: 10            # 夹取前接近高度 cm（夹爪在方块上方，摄像头仍能看到，用于实时微调）
  pick_z: -4               # 抓取高度 cm（夹子还能再低一点）
  grab_pitch: 0            # 夹取时机械臂俯仰角；避免24号自动低头
  pick_distance: 20.0        # 抓取前超声波"够近"确认距离 cm（超过则继续接近）
  pitch: -90               # 俯仰角 deg
  alpha1: -90              # 逆运动学俯仰角搜索范围下界
  alpha2: 100              # 逆运动学俯仰角搜索范围上界
  gripper_open: 120        # 夹爪张开脉宽（舵机25）
  gripper_close: 550       # 夹爪闭合脉宽（舵机25，官方 block_fetch 默认）
  raise_pose: [12, 24, 5]  # 抓取后抬起位置 cm
  release_pose: [12, 24, -5]  # 松开/放置位置 cm
  hand_raise_pose: [0, 10, 25]  # 举手反馈姿态（x, y, z）cm，需现场标定
  hand_hold: 0.8              # 举手保持时间 s
  hand_raise_pulses: {21: 500, 22: 507, 23: 704, 24: 650, 25: 500}  # 举手反馈各舵机脉宽（占位=复位值，需现场标定）
  flip_servos: []             # 方向反的关节（本机机械臂实际没反，留空禁用镜像）
  flip_gripper: false         # 夹爪25是否也镜像方向（本机不用，false）
  reset_pulses: {21: 500, 22: 705, 23: 90, 24: 330, 25: 700}  # 复位/检测位各舵机脉宽（官方默认）

search:
  pan_pulses: [300, 200, 700, 900, 1000]  # 底座(21)水平扫描档位：500向左300→200，再向右700→900→1000
  tilt_scan_step: 20        # 24号平滑扫描每一步的脉宽增量
  pan_step_ms: 350           # 每档转动时间 ms
  tilt_pulses: [200, 400, 600, 800, 1000]  # 相机俯仰(24)扫描档位：200-1000 每次+200
  tilt_step_ms: 350          # 每档转动时间 ms
  align_tol: 50              # 目标中心距画面中心容差 px
  align_step: 40             # 对齐微调步长脉宽
  edge_ratio: 0.15           # 画面边缘判定比例
  confirm_frames: 5          # 稳定确认帧数
  min_area: 100              # 目标最小面积
  body_turn_angle: 120       # 六足每次转身角度 deg
  body_turn_speed: 80        # 六足转身速度

align:
  enabled: false          # 夹取前是否先做朝向对齐（现场标定好再打开）
  ref_angle: 45.0         # 方块"正"时检测到的朝向角（度，mod 90），需现场标定
  servo21_ratio: 4.1667   # 舵机21 脉宽/度 比例（标称值，可微调）
  servo21_dir: 1          # 旋转方向符号 +1 或 -1，需现场标定
  angle_tol: 3.0          # 对齐角度容差（度）
  max_step: 60            # 单次微调最大脉宽，避免一次转太多
  max_iter: 8             # 对齐闭环最大迭代次数
  settle_ms: 400          # 每次微调后等待画面稳定的时间 ms
  min_area: 300           # 对齐检测的最小目标面积
  start_pulse: 500        # 对齐前舵机21的起始脉宽（机械臂朝前检测位）

gimbal_fetch:
  pan_min: 0              # 舵机21 云台扫描下限脉宽
  pan_max: 1000           # 舵机21 云台扫描上限脉宽（约240°）
  pan_step: 40            # 云台扫描步长脉宽
  pan_scan_step: 20         # 21号平滑扫描每一步的脉宽增量
  pan_move_ms: 100          # 21号每小步的移动时间 ms（调大：舵机平缓到位，画面稳定）
  pan_settle_ms: 60         # 21号每小步到位等待 ms（防运动模糊导致漏检/锁定失败）
  pan_detect_interval_ms: 30  # 21号平滑扫描时的取帧间隔 ms
  scan_move_ms: 100         # 24号每小步的移动时间 ms（调大：舵机平缓到位，画面稳定）
  scan_settle_ms: 60        # 24号每小步到位等待 ms（防运动模糊导致漏检/锁定失败）
  detect_interval_ms: 20    # 平滑扫描时的取帧间隔 ms
  cam_start: 330          # 舵机24 相机起始脉宽（≈检测位）
  cam_max: 1000           # 舵机24 相机上限脉宽
  cam_step: 100           # 每扫一圈抬高脉宽
  settle_ms: 280          # 每次转动后等待时间 ms（云台转慢一点）
  min_area: 300           # 目标最小面积
  ultrasonic_max_cm: 400.0  # 超声波超过此值视为无效，改用图片面积
  area_k: 1650.0          # 图片面积->距离系数 dist=k/sqrt(area)，需现场标定
  near_cm: 15.0           # 距离主判定阈值：估算距离 <= 此值才算到位（贴底回升兜底见 search.py _close）
  near_radius: 60          # 目标最小外接圆半径 >= 此值视为够近（夹子太近时调小）
  base_pulse: 220          # 平地检测位 24 号基准脉宽（现场标定）
  radius_per_pulse: 0.0273 # 高度补偿：pulse 每增加 1，目标半径约减少多少 px
  stop_pulse_min: 120      # 24号脉宽低于此值视为已经走到脚下，立即停止逼近
  slow_radius: 35          # 半径 >= 此值用慢速小步，否则快速接近
  pan_band: 80             # 21号偏离500超过此值转六足，把摄像头拉回朝前
  pan_turn_deg: 5          # 每次转身体角度
  walk_mm: 40             # 每次前进距离 mm
  turn_deg: 10            # 每次转向角度 deg
  turn_sign: 1            # 左右方向符号（+1/-1，若左右转反了改成 -1）
  tilt_sign: 1            # 俯仰方向符号：脉宽越大=摄像头越往上抬（800=天花板），目标在画面偏下应减脉宽低头
  pan_sign: 1             # 水平方向符号（+1/-1，待探针实测后定标）
  track_p_gain: 0.2       # 锁定速度：云台 PID 比例增益（越大跟得越快，过大易过冲）
  track_settle_ms: 80     # 跟踪中云台移动后的到位等待 ms（防运动模糊丢帧）
  lost_limit_frames: 15   # 逼近阶段连续丢帧超过该值才放弃（原 3 帧太脆，走路一晃就误判）
  center_wait_ms: 800     # 每步走后等云台把目标拉回画面中部的时间窗 ms
  walk_mm_small: 20       # 未完全锁准时的小步步长 mm（边走边校，与锁定速度同步）
  max_approach: 12        # 接近阶段最大步数
  cx_tol: 30              # 微调居中像素容差（左右）
  cy_tol: 30              # 微调居中像素容差（上下）
  fine_pan_step: 30       # 微调舵机21步长
  fine_tilt_step: 30      # 微调舵机24步长
  max_fine: 8             # 微调最大迭代
  max_retries: 3          # 夹取后位置比对失败的最大重试次数
  shoulder_step: 20       # 每次重试微调舵机22的步长脉宽
  pos_tol: 40             # 目标"还在原地"的像素容差
  # ---- 高度自适应 / 居中闭环 / 重试（auto_search_grab.py 新架构）----
  cy_target: 240          # 搜索俯仰下抓取就绪的目标垂直像素位置（现场标定）
  cy_sign: 1              # 高度修正方向符号（反了改 -1）
  body_lift_step: 5       # 机身每步升降 mm
  body_lift_max: 70       # 机身相对初始高度的最大升降 mm
  arm_tilt_step: 10       # 机身到极限后机械臂俯仰每步 deg
  height_max_iter: 12     # 高度自适应最大迭代次数
  centering_max_iter: 15  # 夹取居中闭环最大迭代次数
  pan_gain: 0.25          # 居中闭环舵机21 的 px->脉宽增益
  grab_attempts: 3        # 夹取总尝试次数
  ultra_min_bottom: 400     # 超声波高度门槛（目标下缘低于此 px 弃用超声波）
  # ---- 寻路快慢步 ----
  fine_cm: 12.0            # （旧快慢切换阈值，已由 slow_cm 替代，保留兼容）
  fast_walk_mm: 70         # 远距大步幅 mm
  fast_speed: 90           # 远距速度
  walk_speed: 50           # 近距速度
  scan_rounds: 3           # 寻路重扫轮数
  slow_cm: 25.0            # 快慢切换阈值：距离 <= 此值改用慢速小步 40mm×1，防近距过冲丢目标
  stop_y: 20.0             # 超声波 y（前向距离 cm）<= 此值停止逼近进入夹取

grab:
  align_x_cm: 0.5          # 夹中对齐 x 阈值 cm
  align_y_cm: 2.0          # 夹中对齐 y 阈值 cm（相对 y_ref）
  y_ref: 15.0              # 检测位前向参考 cm
  y_forward: 0.0           # 夹取点前伸补偿 cm（正=更靠前；官方+2已过度，改0待标定）
  grab_y_min: 6.0          # 夹取前实际 y 下限 cm
  grab_y_max: 22.0         # 夹取前实际 y 上限 cm
  move_tol_px: 40          # 判定块被夹走的像素位移
  pos_ratio: 1.5           # 位移阈值 = max(move_tol_px, pos_ratio*radius)
  attempts: 3              # 夹取重试次数
  align_iter: 20           # 对齐微调最大迭代次数
  fine_step_mm: 12         # 夹取前前后微调步长 mm
  big_step_mm: 30          # 距离偏差大时的大微调步长 mm
  big_radius_gap: 15       # 半径偏差超过此值使用大微调
  tilt_live: true          # 抬头夹取用实时检测坐标换算夹取点（false 退回固定夹取点）
  verify_bottom_margin: 40 # 验证：目标中位数 cy 距画面底部小于此值视为被夹到爪边/贴镜头
  tilt_body_lift: 30       # 抬头夹取前抬机身高度 mm（高处目标该升不降，区别于地面 cy 反馈）
  body_lift_step: 5        # 体态升降步进 mm
  body_lift_max: 70        # 体态升降上限 mm（最高抬升）
  body_lift_min: 0         # 体态升降下限 mm（默认 0，不用负姿态；特殊低处才改负值）
  height_max_iter: 12      # 高度调整迭代上限
  # ---- 倾斜闭环（高处平台路线，官方 grab_blocks.py 同款）----
  tilt_pose: [0, 17, 9]    # 倾斜位机械臂姿态 (x,y,z) cm（目标前方17cm、垫高9cm）
  tilt_pitch: -60          # 倾斜位相机俯仰 deg（朝前下方看 9cm 高目标）
  tilt_cy_min: 180         # 就绪窗口 cy 下限（以跟踪中心 240 为基准）
  tilt_cy_max: 420         # 就绪窗口 cy 上限（放宽，目标偏下 cy~400）
  tilt_cx_min: 250         # 倾斜位 cx 居中窗口下限
  tilt_cx_max: 390         # 倾斜位 cx 居中窗口上限
  tilt_turn_deg: 4         # 倾斜闭环每次转身角度 deg
  tilt_rounds: 12          # 倾斜闭环最大轮数
  fixed_grab: [0, 17]      # 倾斜位验收后的固定夹取点 (x, y) cm（目标前方17cm）
  fixed_grab_z: 9          # 固定夹取点 z cm（目标垫高9cm）
  # ---- 视觉伺服夹取（面积近大远小 + 囊括判断）----
  servo_pitch: 0           # 夹取俯仰角 deg（水平朝前，目标在正前方）
  servo_z: 9               # 夹取高度 cm
  servo_y_start: 8         # 前伸起始 y cm
  servo_y_max: 22          # 前伸最大 y cm
  servo_step_cm: 1         # 前伸步长 cm
  servo_min_area: 5000     # 峰值判断最小面积门槛（面积<此值不判峰值）
  servo_fall_ratio: 0.85   # 面积回落比例（面积<峰值*此值=到峰值夹取）
  servo_fall_frames: 3     # 连续回落帧数（判峰值）
  approach_area_threshold: 2800  # 寻路停止面积阈值（约对应目标 28cm，机械臂可及范围下限内）
  tof_stop_cm: 28.0        # 寻路到位红外距离 cm（红外≤此值停止逼近，交给夹取）
  servo_area_threshold: 1500  # 精夹取面积阈值（320x240 检测，贴近夹爪）
  servo_z_step: 0.5           # 精夹取下调 z 步长 cm
  servo_z_tries: 10           # 精夹取最大下调次数
  # ---- 红外(VL53L0X)算 z 高度 ----
  # ---- 红外(VL53L0X，夹爪下方)靠近夹取 ----
  tof_trigger_cm: 11.0     # 红外到目标触发距离 cm（夹取位实测 110mm）
  down_z_start: 18.0       # 机械臂下降起始高度 cm
  down_z_step: 0.5         # 每次下降步长 cm
  down_z_tries: 52         # 最大下降次数（降到红外 d≈10cm）
  forward_y: 18.0          # 追踪居中后的前伸距离 cm
  servo_raise_z: 15        # 夹取后抬起 z cm
  servo_place_pulse: 800   # 转 21 放置脉宽
  cam_offset_x: 0.0        # 摄像头相对夹爪的水平补偿 cm
  cam_offset_y: 0.0        # 摄像头相对夹爪的前后补偿 cm
  cam_offset_z: -2.0       # 摄像头相对夹爪的高度补偿 cm（自动降点测得的稳定值）
  cam_offset_z_per_radius: -0.02 # 目标半径越大（越近），夹爪高度补偿每 px 变化 cm
  cam_offset_y_per_radius: 0.0   # 目标半径越大，前后补偿每 px 变化 cm
  z_step_down: 0.5             # 每次夹取失败后，夹取点再下调 cm
  z_tries: 3                   # 默认点已经标定，最多再自动下调 3 次
  grab_ref_cx: 320         # 画面中心 cx 基准
  grab_ref_cy: 240         # 画面中心 cy 基准
  grab_x_gain: 0.05        # cx 偏差 -> 夹取 x 的增益 cm/px
  grab_y_gain: 0.05        # cy 偏差 -> 夹取 y 的增益 cm/px
  approach_radius: 35      # 半径达到此值停止大距离微调，开始姿态/角度微调
  grab_radius: 60          # 半径达到此值且 cx/cy 进窗口，开始夹取
  high_pulse_threshold: 280  # 24号脉宽超过此值走高处夹取，否则走低处 pixel_to_arm_coord
  cy_ref: 240             # 高度补偿基准 cy
  height_gain: 0.0        # cy 每偏离基准 1px，z 调整 cm（未标定，先 0 禁用；标定后填符号+大小）
  ultra_weight: 0.0       # 超声波与视觉 y 融合权重（先用0，避免把y拉偏）
  base_pulse: 220         # 高度补偿基准 24 号脉宽
  height_gain_pulse: 0.0  # 24号脉宽高度补偿（先用0，避免用到过期脉宽）
  area_ref: 3000          # 面积-高度映射基准面积
  area_z_gain: 0.0        # 面积高度补偿（先用0）
  cy_target: 240           # 高度信号目标 cy（现场标定）
  cy_tol: 50               # cy 容差 px
  cy_sign: 1               # 高度修正方向
  flat_h_cm: 2.0           # 平面/高处分界：超声波实测高度超过此值才抬机身，否则按平面参考系
  visible_margin_px: 8      # 判定“目标完整出现”的贴边容差 px（外接框距画面边小于此值视为被裁切）
  usable_margin_px: 30      # 目标中心距画面边缘最小留边 px；中心可见即视为可用，可直接夹取
  cam_min: 60              # 舵机24 相机俯仰下限脉宽（防止微调低头过度丢目标）
  cam_max: 600             # 舵机24 相机俯仰上限脉宽
  # ---- 高度自适应开关 ----
  height_enabled: true     # 是否启用体态升降（cy_target 未标定时可先 false）
  reacquire_enabled: true  # 夹取阶段目标丢失时是否自动抬高/降低机身找回
  # ---- 超声波实测高度（grab.py）----
  ultra_samples: 5          # 每次读取内部采样次数（dist_cm 再取 min）
  ultra_rounds: 3           # 一致性校验轮数（相邻两轮差 <= ultra_jump_cm 才采用）
  ultra_max_cm: 100.0       # 超过此距离视为无效（防止扫到后面物体）
  ultra_jump_cm: 8.0        # 两轮读数差超过此值视为不一致
  ultra_offset_cm: 0.0      # 传感器与相机安装偏置修正（传感器比相机近给正值），现场标定
  ultra_gate_cm: 30.0       # 超声波门控：视觉估距超过此值不启用超声波
  ultra_match_cm: 15.0      # 超声波与视觉互证容差 cm
  ultra_min_h_cm: -2.0      # 实测高度低于此值视为读数无效（物体不可能在地下），退回平面参考系
  ultra_max_h_cm: 25.0      # 实测高度高于此值视为异常，退回平面参考系（机械臂可及上限内）
  # ---- 面积峰值判断前伸 + 下降夹取状态机（alpha=0 夹持器水平，无PID）----
  tof_samples: 5            # 红外中位数采样次数（丢 0/超量程后取中）
  reach_y_start: 28.0       # 前伸扫描起始 y cm（alpha=0 有解下限，servo23 不超限）
  reach_y_max: 45.0         # 前伸扫描最大 y cm（要能越过目标，目标约在前方 40cm）
  max_reach_steps: 30       # 前伸最大步数（防死循环兜底；与 reach_y_max 同时作为硬上限）
  reach_gain: 20.0          # 前伸增益 cm/占比：步长 = (grab_area_ratio - 当前占比) * gain
  reach_step_min: 0.5       # 最小前伸步长 cm（占比接近阈值时的小步）
  reach_step_max: 2.0       # 最大前伸步长 cm（看不到/目标远时的大步，慢调）
  lift_pulse: 50            # 夹住后 22 号肩舵机上抬脉宽（+50 抬起，方向反了改负值）
  tof_grab_cm: 4.0          # 下降夹取：红外读数 <= 此值（夹爪到色块顶面）夹取
  descend_step_cm: 0.5      # 下降步长 cm（慢调）
  min_z: 3.0                # 下降 z 下限 cm
  descend_max_steps: 30     # 下降步数上限
  grab_area_ratio: 0.30     # 目标面积占画面(320x240)比例 >= 此值判定夹爪到目标上方，停止前伸直接夹取
  grab_trigger_mm: 110      # 下降夹取距离：红外读 <= 此值触发夹取（含补偿，现场标定）
  coarse_z: 15.0            # 前伸/下降末端高度 cm（alpha=0，红外垂直朝下读约 120mm）
  fast_switch_mm: 200       # 红外 > 此值快速下降，<= 此值切慢速点动
  tof_abnormal_max: 300     # 红外 > 此值视为测距异常（没对准目标/反光），抬升放弃
  tof_abnormal_min: 10      # 红外 < 此值视为测距异常（贴到物体/戳地），抬升放弃
  fast_step_cm: 1.0         # 快速下降步长 cm（10mm）
  slow_step_cm: 0.2         # 慢速点动步长 cm（2mm）
  descend_move_ms: 120      # 每次下降舵机转动时间 ms
  descend_settle_ms: 80     # 每次下降后稳定等待 ms
